  h+=`<div class=ex><h3>${x[0]}</h3><div class=mu>${prev(i,s)}</div><div class=mu>${x[1]} × ${x[2]}${x[3]!=x[2]?'–'+x[3]:''} · Otot: ${x[4]}</div>${fig(x[0])}<p style="margin:4px 0"><b>Teknik:</b> ${x[5]}<br><b>Kesalahan umum:</b> ${x[6]}</p><div class=row><div><label>Beban (kg/dumbbell)</label><input type=number inputmode=decimal min=0 step=.5 value="${e.w||''}" onchange="upd(${i},'w',this.value)"></div>${ri}<div><label>RIR</label><select onchange="upd(${i},'rir',this.value)">${[0,1,2,3].map(n=>`<option ${n==e.rir?'selected':''}>${n}</option>`).join('')}</select></div></div><p class=rec id="rc${i}">${recT(x,e)}</p><p class=mu id="e1${i}">${e1T(x,e)}</p></div>`});
 h+=`<div class=card><label>Catatan latihan</label><textarea rows=2 onchange="S.wk[day]=S.wk[day]||{done:false,e:{}};S.wk[day].note=this.value;save()">${esc((S.wk[day]&&S.wk[day].note)||'')}</textarea><button class="b ${w.done?'s':''}" onclick="S.wk[day]=S.wk[day]||{done:false,e:{}};S.wk[day].done=!S.wk[day].done;save();render()">${w.done?'Batalkan selesai':'Complete workout'}</button></div>`;
 const hist=Object.keys(S.wk).filter(k=>S.wk[k].done).map(Number).sort((a,b)=>b-a);
 return h+`<div class=card><h2>Riwayat latihan</h2>${hist.length?hist.map(d=>{const q=sess(d);return`<div class=it><span>Hari ${d} · ${q>=0?W[q][0]:'-'}</span><span>Volume ${N(vol(d,Math.max(q,0)))} kg</span></div>`}).join(''):'<p class=mu>Belum ada sesi selesai.</p>'}</div>`}
function upd(i,k,v){const e=E(day,i);if(k=='w')e.w=+v||0;else if(k=='rir')e.rir=+v;else e.r[k]=+v||0;save();const x=W[sess(day)][1][i],el=$('#rc'+i);if(el)el.textContent=recT(x,e);const e2=$('#e1'+i);if(e2)e2.innerHTML=e1T(x,e)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
function vNu(){const c=calc(),f=tot(day),it=S.food[day]||[];
 return`<div class=card><h2>Kalkulator (estimasi awal)</h2><div class=g><div><label>BMR (Mifflin-St Jeor)</label><b>${N(c.bmr)} kkal</b></div><div><label>TDEE</label><b>${N(c.tdee)} kkal</b></div><div><label>Target kalori (defisit ${S.p.def}%)</label><b>${N(c.kcal)} kkal</b></div><div><label>Protein (1,8 g/kg)</label><b>${N(c.pr)} g</b></div><div><label>Lemak (0,8 g/kg)</label><b>${N(c.fat)} g</b></div><div><label>Karbohidrat (sisa)</label><b>${N(c.carb)} g</b></div><div><label>Air (±35 ml/kg)</label><b>${N(c.water,1)} L</b></div></div><p class=mu>Ini perkiraan, bukan kebutuhan pasti. Ubah profil, aktivitas, atau persentase defisit di Settings, lalu evaluasi tiap minggu.</p></div>
<div class=card><h2>Sisa target hari ${day}</h2><div class=g><div><label>Kalori</label><b>${N(c.kcal-f.k)} kkal</b></div><div><label>Protein</label><b>${N(c.pr-f.p)} g</b></div><div><label>Konsumsi</label><b>${N(f.k)} kkal · P${N(f.p)} K${N(f.c)} L${N(f.f)}</b></div></div></div>
${wtT()}<div class=card><h2>Tambah makanan</h2><div class=row><div style="flex:3"><label>Makanan (nilai per 100 g, estimasi)</label><select id=fs onchange="$('#fg').value=this.value[0]=='f'?1:100">${FD.map((x,i)=>`<option value=${i}>${x[0]}</option>`).join('')}${(S.fav||[]).map((x,i)=>`<option value=f${i}>⭐ ${esc(x[0])} (1 porsi)</option>`).join('')}</select></div><div><label>Gram / porsi</label><input id=fg type=number inputmode=decimal value=100 min=1></div></div><button class=b onclick="addF()">Tambah</button>
<h3>Dari label nutrisi / manual</h3><div class=row><div style="flex:2"><label>Nama</label><input id=mn></div><div><label>kkal</label><input id=mk type=number inputmode=decimal></div><div><label>Protein</label><input id=mp type=number inputmode=decimal></div><div><label>Karbo</label><input id=mc type=number inputmode=decimal></div><div><label>Lemak</label><input id=mf type=number inputmode=decimal></div></div><label style="display:flex;gap:6px;align-items:center;margin-top:6px;font-size:14px;color:var(--tx)"><input type=checkbox id=ms style="width:auto"> ⭐ Simpan ke daftar pilihan makanan</label><button class=b onclick="addM()">Tambah dari label</button></div>
<div class=card><h2>Log hari ${day}</h2>${day>1?`<button class="b s" ${(S.food[day-1]||[]).length?'':'disabled'} onclick="cp()">Salin dari Hari Sebelumnya (${(S.food[day-1]||[]).length})</button>`:''}${it.length?it.map((x,i)=>`<div class=it><span>${esc(x.n)} <i class=mu>(${x.e})</i><br><span class=mu>${N(x.k)} kkal · P${N(x.p,1)} K${N(x.c,1)} L${N(x.f,1)}</span></span><button class="b d" onclick="S.food[day].splice(${i},1);save();render()">Hapus</button></div>`).join(''):'<p class=mu>Belum ada makanan.</p>'}</div>`}
function push(o){(S.food[day]=S.food[day]||[]).push(o);save();render()}
function addF(){const v=$('#fs').value,q=+$('#fg').value||0;if(v[0]=='f'){const x=S.fav[+v.slice(1)];if(!x)return;push({n:x[0]+' ×'+q+' porsi',k:x[1]*q,p:x[2]*q,c:x[3]*q,f:x[4]*q,e:'label'});return}const x=FD[v],m=q/100;push({n:x[0]+' '+q+' g',k:x[1]*m,p:x[2]*m,c:x[3]*m,f:x[4]*m,e:'estimasi'})}
function addM(){const k=+$('#mk').value;if(!$('#mn').value||!(k>=0))return;if($('#ms').checked){S.fav=S.fav||[];S.fav.push([$('#mn').value,k,+$('#mp').value||0,+$('#mc').value||0,+$('#mf').value||0])}push({n:$('#mn').value,k,p:+$('#mp').value||0,c:+$('#mc').value||0,f:+$('#mf').value||0,e:'label'})}
function vCo(){const f=tot(day);return`<div class=card><h2>Input kopi</h2><div class=g><div><label>Jenis</label><select id=ct onchange="cof()"><option value=0>Espresso</option><option value=1>Americano</option><option value=2 selected>Latte</option></select></div><div><label>Ukuran</label><select id=cz onchange="cof()"><option value=0>Kecil (1 shot)</option><option value=1 selected>Sedang (2 shot)</option><option value=2>Besar (3 shot)</option></select></div><div><label>Susu</label><select id=cm onchange="cof()">${MK.map((x,i)=>`<option value=${i}>${x[0]}</option>`).join('')}</select></div><div><label>Gula (sendok teh)</label><input id=cg type=number inputmode=decimal min=0 value=0 onchange="cof()"></div><div><label>Sirup (pump)</label><input id=cs type=number inputmode=decimal min=0 value=0 onchange="cof()"></div></div><div id=cr class=card style="margin-top:10px"></div><button class=b onclick="addC()">Tambah ke log makanan</button></div>
<div class=card><h2>Kafein hari ${day}: ${N(f.caf)} mg</h2>${pb(f.caf,400,f.caf>400?'#ef4444':'')}<p class=mu>Batas umum untuk dewasa sehat: sekitar 400 mg/hari (EFSA, FDA).</p></div>
${cutT()}<div class=card><h2>Panduan</h2><p>Espresso dan Americano hampir tanpa kalori (±2–10 kkal). Kalori latte berasal dari susu, gula, dan sirup: latte sedang dengan susu full cream bisa 130–160 kkal, tanpa gula maupun dengan gula tambahan. Susu skim atau almond tanpa gula lebih rendah kalori.</p><p>Kafein 3–6 mg/kg berat badan sekitar 60 menit sebelum latihan dapat meningkatkan performa (ISSN), tetapi dosis tinggi dapat menimbulkan gelisah. Hindari kafein 6–8 jam sebelum tidur karena tidur memengaruhi pemulihan. Olahraga tidak otomatis menghapus kalori minuman, jadi catat semuanya.</p></div>`}
function cof(){const t=+$('#ct').value,z=+$('#cz').value,m=MK[+$('#cm').value],g=+$('#cg').value||0,sy=+$('#cs').value||0,sh=z+1;
 const ml=t==2?[150,220,300][z]:0,mk=ml/100,k=2*sh+(t==1?3:0)+m[1]*mk+g*16+sy*20,p=m[2]*mk+.3*sh,c=m[3]*mk+g*4+sy*5,f=m[4]*mk,caf=63*sh;
 lastC={n:['Espresso','Americano','Latte'][t]+' '+['kecil','sedang','besar'][z]+(t==2?', susu '+m[0].toLowerCase():'')+(g?', gula '+g+' sdt':'')+(sy?', sirup '+sy+' pump':''),k,p,c,f,caf,e:'estimasi'};
 $('#cr').innerHTML=`<b>${N(k)} kkal</b> · P${N(p,1)} K${N(c,1)} L${N(f,1)} · Kafein ±${caf} mg <span class=mu>(estimasi)</span>`}
function addC(){if(lastC)push(Object.assign({},lastC))}
function vPr(){const L=S.log[day]||{},F=(k,l)=>`<div><label>${l}</label><input type=number inputmode=decimal step=.1 min=0 value="${L[k]||''}" onchange="lg('${k}',this.value)"></div>`;
 const v=[];for(let d=1;d<=30;d++){const q=sess(d);if(q>=0&&vol(d,q)>0)v.push([d,vol(d,q)])}
 return`<div class=card><h2>Catat hari ${day}</h2><div class=g>${F('w','Berat badan (kg)')}${F('waist','Lingkar perut (cm)')}${F('chest','Lingkar dada (cm)')}${F('arm','Lingkar lengan (cm)')}${F('thigh','Lingkar paha (cm)')}${F('steps','Langkah')}${F('sleep','Tidur (jam)')}${F('sfb','Biceps (mm)')}${F('sft','Triceps (mm)')}${F('sfs','Subscapular (mm)')}${F('sfi','Suprailiac (mm)')}${F('bf','Body Fat % manual (opsional)')}</div><div id=lb>${lbmT(L)}</div><p class=mu>Ukur pagi hari, sebelum makan, dengan kondisi sama. Perut: setinggi pusar saat napas keluar. Dada: setinggi puting. Lengan: bagian terbesar (relaks). Paha: bagian terbesar. Foto progres dapat disimpan di galeri ponsel Anda.</p></div>
<div id=pc><div class=card><h2>Berat badan (kg)</h2>${chart(ser('w'),'#60a5fa',' kg',ma(ser('w')),'#f472b6')}</div><div class=card><h2>Lean Body Mass (kg)</h2>${chart(lbs(),'#a78bfa',' kg')}</div><div class=card><h2>Lingkar perut (cm)</h2>${chart(ser('waist'),'#34d399',' cm')}</div><div class=card><h2>Volume latihan per sesi (kg)</h2>${chart(v,'#fbbf24',' kg')}</div>
</div><div class=card><h2>Evaluasi</h2><p>${phase(day)}.</p><p class=mu>Kenaikan berat badan tidak otomatis berarti otot bertambah. Nilai tren lingkar perut, kekuatan latihan, dan berat dalam 1–2 minggu. Jika kelelahan menumpuk atau performa turun, kurangi volume sekitar 30–50% selama satu minggu (deload).</p></div>`}
function lg(k,v){S.log[day]=S.log[day]||{};S.log[day][k]=+v||0;save();const t=document.createElement('div');t.innerHTML=vPr();['#lb','#pc'].forEach(q=>{const a=$(q),b=t.querySelector(q);if(a&&b)a.innerHTML=b.innerHTML})}
function vEd(){const D=(t,b)=>`<details><summary>${t}</summary><p>${b}</p></details>`;return`<div class=card><h2>Edukasi</h2>
${D('1. Apa itu body recomposition?','Menurunkan lemak sambil mempertahankan atau menambah otot pada waktu yang sama. Paling realistis pada pemula, orang yang kembali berlatih, atau yang kelebihan lemak, dengan latihan beban dan protein cukup.')}
${D('2. Fat loss vs weight loss','Weight loss adalah turunnya berat total (lemak, otot, air, glikogen). Fat loss khusus lemak. Karena itu pantau juga lingkar perut dan kekuatan, bukan hanya timbangan.')}
${D('3. Cara kerja defisit kalori','Lemak tubuh berkurang saat energi masuk lebih kecil daripada energi yang dipakai. Defisit ringan (±15–20%) lebih mudah dipertahankan dan lebih aman untuk otot. Lemak perut tidak bisa dipilih untuk dibakar; lemak turun dari seluruh tubuh.')}
${D('4. Protein dan sintesis protein otot','Asam amino dari protein menjadi bahan perbaikan dan pertumbuhan otot. ISSN menyebut kisaran 1,4–2,0 g/kg/hari untuk orang aktif; pada defisit kalori, nilai yang lebih tinggi dapat membantu menjaga otot. Bagi ke 3–5 waktu makan.')}
${D('5. Karbohidrat','Sumber energi utama untuk latihan intensitas sedang-tinggi dan pengisi glikogen otot. Pilih sumber utuh (nasi, oat, umbi, buah) dan atur porsinya sesuai sisa kalori.')}
${D('6. Lemak dan hormon','Lemak diperlukan untuk penyerapan vitamin A, D, E, K dan pembentukan hormon (termasuk steroid). Jangan terlalu rendah; sekitar 0,6–1 g/kg umumnya memadai.')}
${D('7. Tidur dan pemulihan','Otot pulih dan beradaptasi saat istirahat. Orang dewasa umumnya membutuhkan 7–9 jam tidur. Kurang tidur dapat menurunkan performa dan memperburuk nafsu makan.')}
${D('8. Makan sebelum dan sesudah latihan','Makan karbohidrat plus protein 1–3 jam sebelum latihan. Setelah latihan, makan yang mengandung protein (±0,3 g/kg) dalam beberapa jam. Total harian lebih penting daripada waktu yang presisi.')}
${D('9. Cara menghitung kalori','Timbang makanan, gunakan label nutrisi bila ada, lalu catat. Nilai dalam aplikasi ini adalah estimasi; masakan rumahan dan minyak sering membuat angka meleset, jadi evaluasi tren mingguan.')}
${D('10. Mempertahankan otot saat defisit','Latihan beban dengan progressive overload, protein cukup, defisit ringan, tidur cukup, dan kardio tidak berlebihan.')}
<h3>Referensi</h3><p class=mu>Mifflin MD dkk. (1990) Am J Clin Nutr 51:241–247 · Jäger R dkk. (2017) ISSN Position Stand: Protein and Exercise, JISSN 14:20 · Kerksick CM dkk. (2018) ISSN Position Stand: Nutrient Timing, JISSN 15:33 · Guest NS dkk. (2021) ISSN Position Stand: Caffeine and Exercise Performance, JISSN 18:1 · ACSM Guidelines for Exercise Testing and Prescription · WHO Guidelines on Physical Activity and Sedentary Behaviour (2020) · EFSA Scientific Opinion on caffeine safety (2015)</p></div>`}
function vSt(){const p=S.p,I=(k,l,t='number')=>`<div><label>${l}</label><input type=${t} step=.1 value="${esc(p[k])}" onchange="sp('${k}',this.value)"></div>`;
 return`${mSel()}<div class=card><h2>Profil (dapat diedit)</h2><div class=g><div><label>Jenis kelamin</label><select onchange="sp('sex',this.value,1)"><option value=M ${p.sex=='M'?'selected':''}>Laki-laki</option><option value=F ${p.sex=='F'?'selected':''}>Perempuan</option></select></div>${I('age','Usia (asumsi, edit)')}${I('h','Tinggi (cm)')}${I('w','Berat awal (kg)')}<div><label>Aktivitas</label><select onchange="sp('act',this.value)">${[[1.2,'Minim'],[1.375,'Ringan'],[1.55,'Cukup aktif'],[1.725,'Sangat aktif']].map(a=>`<option value=${a[0]} ${a[0]==p.act?'selected':''}>${a[1]} (×${a[0]})</option>`).join('')}</select></div>${I('def','Defisit kalori (%)')}${I('start','Tanggal mulai (Hari 1)','date')}</div></div>
<div class=card><h2>Cadangan data</h2><p class=mu>Data tersimpan di browser perangkat ini. Salin teks cadangan untuk memindahkannya ke perangkat lain.</p><textarea id=bk rows=3></textarea><button class=b onclick="$('#bk').value=JSON.stringify(S)">Ekspor</button><button class="b s" onclick="imp()">Impor</button><button class=b onclick="dl()">Unduh Backup (.json)</button><label class="b s" style="display:inline-block;cursor:pointer;border-radius:10px;padding:9px 14px;margin:4px 0 0">Unggah File (.json)<input type=file accept=".json,application/json" hidden onchange="up(this.files[0])"></label></div><div class=card><button class=b onclick="S.theme=S.theme=='dark'?'light':'dark';save();go('st')">Ganti tema</button><button class="b d" onclick="reset()">${armed?'Ketuk lagi untuk menghapus SEMUA data':'Reset semua data'}</button></div>`}
function sp(k,v,s){S.p[k]=(s||k=='start')?v:+v;save();if(k=='start'){load2();render()}}
function load2(){day=cd()}
function imp(t){try{const o=JSON.parse(typeof t=='string'?t:$('#bk').value);if(!(o&&o.p&&typeof o.p=='object'&&(o.mm||(o.log&&o.wk&&o.food))))throw 0;o.theme=o.theme||'dark';S=o;fix();save();load2();render()}catch(e){const b=$('#bk');if(b){b.value='';b.placeholder='Data cadangan tidak valid'}}}
function reset(){if(!armed){armed=true;render();return}armed=false;try{localStorage.removeItem(KEY)}catch(e){}load();render()}
let tI,tE=0,AC=null;
function rt(s){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}clearInterval(tI);tE=Date.now()+s*1000;tick();tI=setInterval(tick,250)}
function rs(){clearInterval(tI);$('#tt').textContent='00:00'}
function beep(){try{if(AC)[0,.25,.5].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.15)})}catch(e){}try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
function tick(){const ts=Math.max(0,Math.ceil((tE-Date.now())/1000));$('#tt').textContent=String(Math.floor(ts/60)).padStart(2,'0')+':'+String(ts%60).padStart(2,'0');if(ts<=0){clearInterval(tI);beep()}}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){document.documentElement.dataset.theme=S.theme;$('#hl').textContent='Hari '+day+' / 30';$('#nv').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('#app').innerHTML={dash:vDash,wo:vWo,nu:vNu,co:vCo,pr:vPr,ed:vEd,st:vSt}[tab]();if(tab=='co')cof()}
load();render();
try{icon()}catch(e){}
</script></body></html>
