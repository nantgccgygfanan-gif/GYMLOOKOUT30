<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Rekomposisi Tubuh 30 Hari</title><style>
:root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mu:#8b92a3;--ac:#34d399;--ac2:#60a5fa;--wa:#fbbf24;--bd:#2a2e3a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f4f6f9;--card:#fff;--tx:#161a22;--mu:#5d6577;--ac:#059669;--ac2:#2563eb;--wa:#b45309;--bd:#dde1e8;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

body{background:radial-gradient(1200px 500px at 50% -200px,rgba(52,211,153,.14),transparent),var(--bg)}
header{max-width:860px;margin:auto;padding:14px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}header b{font-size:20px;letter-spacing:-.3px}
nav{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border:0;padding:8px 12px}

.card{border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:16px}
button.b{background:linear-gradient(135deg,var(--ac),#22d3ee);border-radius:10px;transition:transform .1s}button.b:active{transform:scale(.96)}button.s{background:var(--bd);color:var(--tx)}button.d{background:#ef4444;color:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}

<header><b>💪 Recomp 30</b><span id="hd" class="mu"></span></header><nav id="nv"></nav><div id="app"></div>
<div id="tm"><span class="mu">Rest timer</span><b id="tt">00:00</b><button class="b s" onclick="rt(60)">60 dtk</button><button class="b s" onclick="rt(90)">90 dtk</button><button class="b s" onclick="rt(120)">120 dtk</button></div>
<script>
const KEY='recomp30',$=s=>document.querySelector(s);let S,tab='dash',day=1,lastC=null,armed=false;
const TABS=[['dash','🏠 Dashboard'],['wo','🏋️ Workout'],['nu','🍽️ Nutrition'],['co','☕ Coffee'],['pr','📈 Progress'],['ed','📖 Edukasi'],['st','⚙️ Settings']];
const W=[
['Upper Body A',[['Dumbbell Floor Press',3,8,12,'Dada, bahu depan, triseps','Berbaring, lutut ditekuk, turunkan lengan atas hingga menyentuh lantai, dorong ke atas.','Siku terlalu melebar; memantul di lantai.'],['One Arm Dumbbell Row',3,10,12,'Punggung (lat), bisep','Satu tangan bertumpu, punggung datar, tarik siku ke arah pinggul.','Badan memutar; menarik dengan bahu.'],['Dumbbell Shoulder Press',3,8,12,'Bahu, triseps','Berdiri/duduk, core kencang, dorong ke atas tanpa melengkungkan punggung bawah.','Punggung melengkung berlebihan.'],['Dumbbell Lateral Raise',3,12,15,'Bahu samping','Angkat ke samping hingga setinggi bahu, siku sedikit ditekuk.','Mengayun badan; beban terlalu berat.'],['Dumbbell Biceps Curl',2,10,15,'Bisep','Siku menempel badan, naik penuh, turun terkontrol.','Mengayun badan.'],['Overhead Triceps Extension',2,10,15,'Triseps','Dumbbell di belakang kepala, siku menghadap ke depan, luruskan lengan.','Siku melebar; punggung melengkung.']]],
['Lower Body A',[['Goblet Squat',3,8,12,'Paha depan, gluteus','Dumbbell di dada, turun hingga paha sejajar lantai, lutut searah jari kaki.','Tumit terangkat; lutut masuk ke dalam.'],['Dumbbell Romanian Deadlift',3,10,12,'Hamstring, gluteus','Lutut sedikit ditekuk, dorong pinggul ke belakang, punggung datar.','Punggung membulat.'],['Reverse Lunge',3,8,10,'Paha, gluteus (per kaki)','Langkah mundur, lutut depan stabil, turun terkontrol.','Langkah terlalu pendek; badan condong.'],['Dumbbell Glute Bridge',3,12,15,'Gluteus','Berbaring, dumbbell di pinggul, dorong pinggul sampai lurus, tahan sebentar.','Punggung bawah melengkung.'],['Standing Calf Raise',3,15,20,'Betis','Naik setinggi mungkin, turun penuh.','Gerakan terlalu cepat.'],['Plank (detik)',3,30,45,'Core','Tubuh lurus, perut kencang.','Pinggul turun atau naik.']]],
['Upper Body B',[['Push-up',3,8,12,'Dada, triseps','Tubuh lurus, dada hampir menyentuh lantai. Boleh di lutut.','Pinggul turun; siku terlalu melebar.'],['Dumbbell Bent Over Row',3,8,12,'Punggung','Pinggul mundur, punggung datar, tarik ke arah pinggang.','Punggung membulat.'],['Dumbbell Arnold Press',3,10,12,'Bahu','Putar telapak saat mendorong ke atas.','Terlalu berat sehingga bahu terangkat.'],['Dumbbell Reverse Fly',2,12,15,'Bahu belakang','Condong ke depan, buka lengan ke samping.','Menggunakan momentum.'],['Hammer Curl',2,10,15,'Bisep, lengan bawah','Telapak saling berhadapan, siku diam.','Mengayun.'],['Dumbbell Triceps Extension',2,10,15,'Triseps','Gerakkan hanya di siku, lengan atas stabil.','Bahu ikut bergerak.']]],
['Lower Body B',[['Bulgarian Split Squat',3,8,10,'Paha, gluteus (per kaki)','Kaki belakang di bangku, turun dengan badan tegak.','Kaki depan terlalu dekat; lutut goyah.'],['Dumbbell Sumo Squat',3,10,12,'Paha dalam, gluteus','Kaki lebar, ujung kaki keluar, dumbbell di antara kaki.','Lutut masuk ke dalam.'],['Dumbbell Romanian Deadlift',3,10,12,'Hamstring, gluteus','Dorong pinggul ke belakang, punggung datar.','Punggung membulat.'],['Dumbbell Step Up',2,10,10,'Paha, gluteus (per kaki)','Naik dengan tumit, tidak mendorong dari kaki belakang.','Memakai momentum.'],['Calf Raise',3,15,20,'Betis','Naik penuh, turun terkontrol.','Terlalu cepat.'],['Dead Bug',3,10,10,'Core (per sisi)','Punggung bawah menempel lantai, gerakkan lengan dan kaki berlawanan.','Punggung bawah terangkat.']]]];
const SCH={1:0,2:1,4:2,6:3},DN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const FD=[['Nasi putih matang',130,2.7,28,.3],['Dada ayam matang',165,31,0,3.6],['Telur ayam',143,12.6,.7,9.5],['Tempe goreng/panggang',192,20,9,11],['Tahu',76,8,1.9,4.8],['Ikan (mis. tongkol/salmon rata-rata)',150,22,0,7],['Daging sapi tanpa lemak',200,26,0,10],['Oatmeal matang',71,2.5,12,1.5],['Pisang',89,1.1,23,.3],['Susu sapi full cream',61,3.3,4.7,3.3],['Whey protein (bubuk)',380,78,8,6]];
const MK=[['Full cream',61,3.3,4.7,3.3],['Rendah lemak',42,3.4,4.9,1.5],['Skim',34,3.4,5,.1],['Oat (tanpa gula)',48,1,6.5,1.5],['Almond (tanpa gula)',15,.5,.3,1.1]];
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S)S={p:{sex:'M',age:18,h:171,w:85,act:1.55,def:20,start:new Date().toISOString().slice(0,10)},log:{},wk:{},food:{},theme:'dark'};
 const d=Math.floor((Date.now()-new Date(S.p.start+'T00:00:00'))/864e5)+1;day=Math.min(30,Math.max(1,d))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const N=(v,d=0)=>Number(v).toLocaleString('id-ID',{maximumFractionDigits:d});
function dt(d){const x=new Date(S.p.start+'T00:00:00');x.setDate(x.getDate()+d-1);return x}
function sess(d){const g=dt(d).getDay();return g in SCH?SCH[g]:-1}
function phase(d){return d<=7?'Minggu 1: Adaptasi (fokus teknik, sisakan 3 repetisi)':d<=14?'Minggu 2: Progressive overload':d<=21?'Minggu 3: Penguatan':d<=28?'Minggu 4: Konsolidasi (deload bila lelah menumpuk)':'Hari 29–30: Evaluasi akhir'}
function calc(){const p=S.p,bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=='M'?5:-161),tdee=bmr*p.act,kcal=tdee*(1-p.def/100),pr=1.8*p.w,fat=.8*p.w;return{bmr,tdee,kcal,pr,fat,carb:Math.max(0,(kcal-pr*4-fat*9)/4),water:p.w*.035}}
function tot(d){const t={k:0,p:0,c:0,f:0,caf:0};(S.food[d]||[]).forEach(i=>{t.k+=i.k;t.p+=i.p;t.c+=i.c;t.f+=i.f;t.caf+=i.caf||0});return t}
function E(d,i){S.wk[d]=S.wk[d]||{done:false,e:{}};return S.wk[d].e[i]=S.wk[d].e[i]||{w:0,r:[],rir:2}}
function vol(d,s){const w=S.wk[d];if(!w)return 0;let v=0;W[s][1].forEach((x,i)=>{const e=w.e[i];if(e&&e.w)v+=e.w*e.r.reduce((a,b)=>a+(b||0),0)});return v}
function ring(v,m,l,u){const r=40,c=2*Math.PI*r,p=Math.min(1,v/m||0);return`<div><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 50 50)"/><text x="50" y="55" text-anchor="middle" font-size="18" font-weight="700" style="fill:var(--tx)">${Math.round(p*100)}%</text></svg><b>${N(v)}</b><div class=mu>/ ${N(m)} ${u}<br>${l}</div></div>`}
function pb(v,m){return`<div class=bar><i style="width:${Math.min(100,v/m*100||0)}%"></i></div>`}
function chart(pts,col,u){if(pts.length<2)return'<p class=mu>Catat minimal 2 hari untuk menampilkan grafik.</p>';const ys=pts.map(p=>p[1]),a=Math.min(...ys),b=Math.max(...ys),r=b-a||1,X=x=>30+(x-1)/29*260,Y=y=>100-(y-a)/r*80;
 return`<svg viewBox="0 0 300 120" style="width:100%"><polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>${pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${col}"/>`).join('')}<text x="2" y="24" style="fill:var(--mu)" font-size="9">${N(b,1)}${u}</text><text x="2" y="104" style="fill:var(--mu)" font-size="9">${N(a,1)}${u}</text><text x="30" y="118" style="fill:var(--mu)" font-size="9">Hari 1</text><text x="262" y="118" style="fill:var(--mu)" font-size="9">Hari 30</text></svg>`}
function ser(k){return Object.keys(S.log).map(Number).filter(d=>S.log[d][k]>0).sort((a,b)=>a-b).map(d=>[d,S.log[d][k]])}
function vDash(){const c=calc(),f=tot(day),s=sess(day),L=S.log[day]||{},done=Object.keys(S.wk).filter(k=>S.wk[k].done).length;
 let cal='';for(let d=1;d<=30;d++){const sx=sess(d);cal+=`<div class="${sx>=0?'w':''} ${S.wk[d]&&S.wk[d].done?'ok':''} ${d==day?'sel':''}" onclick="day=${d};go('dash')"><b>${d}</b><span>${DN[dt(d).getDay()].slice(0,3)}</span></div>`}
 return`<div class="card hero"><h2>Hari ${day} dari 30 · ${DN[dt(day).getDay()]}</h2><p class=mu>${phase(day)}</p><p>Sesi: <b>${s>=0?W[s][0]:'Recovery (jalan 20–30 menit, mobilitas)'}</b></p><button class=b onclick="go('wo')">Buka workout</button></div>
<div class=card><h2>Hari ini</h2><div class=rings>${ring(f.k,c.kcal,'Kalori','kkal')}${ring(f.p,c.pr,'Protein','g')}${ring(L.steps||0,8000,'Langkah','')}</div><p class=mu>Workout selesai: ${done} dari 16 sesi terjadwal (perkiraan 4 sesi/minggu).</p></div>
<div class=card><h2>Kalender (ketuk hari)</h2><div class=cal>${cal}</div><p class=mu>Garis biru: hari latihan · Hijau: selesai</p></div>`}
function vWo(){const s=sess(day);let h=`<div class=card><h2>Hari ${day} · ${s>=0?W[s][0]:'Recovery'}</h2><p class=mu>${phase(day)}. Targetkan RIR 1–3 (sisa 1–3 repetisi). Teknik lebih penting daripada beban.</p></div>`;
 if(s<0)return h+`<div class=card><p>Hari pemulihan: jalan cepat 20–30 menit, peregangan ringan, tidur cukup. Lompat tali (opsional) 5–10 menit bila tidak lelah. Jangan menambah kardio berlebihan agar pemulihan otot tetap baik.</p></div>`;
 const w=S.wk[day]||{e:{}};
 W[s][1].forEach((x,i)=>{const e=(w.e&&w.e[i])||{w:0,r:[],rir:2};let ri='';for(let j=0;j<x[1];j++)ri+=`<div><label>Set ${j+1}</label><input type=number min=0 value="${e.r[j]||''}" onchange="upd(${i},${j},this.value)"></div>`;
  const ok=e.w>0&&e.r.length>=x[1]&&e.r.slice(0,x[1]).every(v=>v>=x[3]);let rc=ok?(e.rir>=1?'Saran: naikkan beban 1–2 kg pada sesi berikutnya (batas atas tercapai dengan RIR ≥1).':'Batas atas tercapai, tetapi RIR 0. Pertahankan beban dan pastikan teknik baik.'):'Pertahankan beban hingga semua set mencapai '+x[3]+' repetisi dengan teknik baik.';if(x[0].startsWith('Plank'))rc='';
  h+=`<div class=ex><h3>${x[0]}</h3><div class=mu>${x[1]} × ${x[2]}${x[3]!=x[2]?'–'+x[3]:''} · Otot: ${x[4]}</div><p style="margin:4px 0"><b>Teknik:</b> ${x[5]}<br><b>Kesalahan umum:</b> ${x[6]}</p><div class=row><div><label>Beban (kg/dumbbell)</label><input type=number min=0 step=.5 value="${e.w||''}" onchange="upd(${i},'w',this.value)"></div>${ri}<div><label>RIR</label><select onchange="upd(${i},'rir',this.value)">${[0,1,2,3].map(n=>`<option ${n==e.rir?'selected':''}>${n}</option>`).join('')}</select></div></div><p class=rec>${rc}</p></div>`});
 h+=`<div class=card><label>Catatan latihan</label><textarea rows=2 onchange="S.wk[day]=S.wk[day]||{done:false,e:{}};S.wk[day].note=this.value;save()">${(S.wk[day]&&S.wk[day].note)||''}</textarea><button class="b ${w.done?'s':''}" onclick="S.wk[day]=S.wk[day]||{done:false,e:{}};S.wk[day].done=!S.wk[day].done;save();render()">${w.done?'Batalkan selesai':'Complete workout'}</button></div>`;
 const hist=Object.keys(S.wk).filter(k=>S.wk[k].done).map(Number).sort((a,b)=>b-a);
 return h+`<div class=card><h2>Riwayat latihan</h2>${hist.length?hist.map(d=>{const q=sess(d);return`<div class=it><span>Hari ${d} · ${q>=0?W[q][0]:'-'}</span><span>Volume ${N(vol(d,Math.max(q,0)))} kg</span></div>`}).join(''):'<p class=mu>Belum ada sesi selesai.</p>'}</div>`}
function upd(i,k,v){const e=E(day,i);if(k=='w')e.w=+v;else if(k=='rir')e.rir=+v;else e.r[k]=+v;save();render()}
function vNu(){const c=calc(),f=tot(day),it=S.food[day]||[];
 return`<div class=card><h2>Kalkulator (estimasi awal)</h2><div class=g><div><label>BMR (Mifflin-St Jeor)</label><b>${N(c.bmr)} kkal</b></div><div><label>TDEE</label><b>${N(c.tdee)} kkal</b></div><div><label>Target kalori (defisit ${S.p.def}%)</label><b>${N(c.kcal)} kkal</b></div><div><label>Protein (1,8 g/kg)</label><b>${N(c.pr)} g</b></div><div><label>Lemak (0,8 g/kg)</label><b>${N(c.fat)} g</b></div><div><label>Karbohidrat (sisa)</label><b>${N(c.carb)} g</b></div><div><label>Air (±35 ml/kg)</label><b>${N(c.water,1)} L</b></div></div><p class=mu>Ini perkiraan, bukan kebutuhan pasti. Ubah profil, aktivitas, atau persentase defisit di Settings, lalu evaluasi tiap minggu.</p></div>
<div class=card><h2>Sisa target hari ${day}</h2><div class=g><div><label>Kalori</label><b>${N(c.kcal-f.k)} kkal</b></div><div><label>Protein</label><b>${N(c.pr-f.p)} g</b></div><div><label>Konsumsi</label><b>${N(f.k)} kkal · P${N(f.p)} K${N(f.c)} L${N(f.f)}</b></div></div></div>
<div class=card><h2>Tambah makanan</h2><div class=row><div style="flex:3"><label>Makanan (nilai per 100 g, estimasi)</label><select id=fs>${FD.map((x,i)=>`<option value=${i}>${x[0]}</option>`).join('')}</select></div><div><label>Gram</label><input id=fg type=number value=100 min=1></div></div><button class=b onclick="addF()">Tambah</button>
<h3>Dari label nutrisi / manual</h3><div class=row><div style="flex:2"><label>Nama</label><input id=mn></div><div><label>kkal</label><input id=mk type=number></div><div><label>Protein</label><input id=mp type=number></div><div><label>Karbo</label><input id=mc type=number></div><div><label>Lemak</label><input id=mf type=number></div></div><button class=b onclick="addM()">Tambah dari label</button></div>
<div class=card><h2>Log hari ${day}</h2>${it.length?it.map((x,i)=>`<div class=it><span>${x.n} <i class=mu>(${x.e})</i><br><span class=mu>${N(x.k)} kkal · P${N(x.p,1)} K${N(x.c,1)} L${N(x.f,1)}</span></span><button class="b d" onclick="S.food[day].splice(${i},1);save();render()">Hapus</button></div>`).join(''):'<p class=mu>Belum ada makanan.</p>'}</div>`}
function push(o){(S.food[day]=S.food[day]||[]).push(o);save();render()}
function addF(){const x=FD[$('#fs').value],g=+$('#fg').value||0,m=g/100;push({n:x[0]+' '+g+' g',k:x[1]*m,p:x[2]*m,c:x[3]*m,f:x[4]*m,e:'estimasi'})}
function addM(){const k=+$('#mk').value;if(!$('#mn').value||!(k>=0))return;push({n:$('#mn').value,k,p:+$('#mp').value||0,c:+$('#mc').value||0,f:+$('#mf').value||0,e:'label'})}
function vCo(){const f=tot(day);return`<div class=card><h2>Input kopi</h2><div class=g><div><label>Jenis</label><select id=ct onchange="cof()"><option value=0>Espresso</option><option value=1>Americano</option><option value=2 selected>Latte</option></select></div><div><label>Ukuran</label><select id=cz onchange="cof()"><option value=0>Kecil (1 shot)</option><option value=1 selected>Sedang (2 shot)</option><option value=2>Besar (3 shot)</option></select></div><div><label>Susu</label><select id=cm onchange="cof()">${MK.map((x,i)=>`<option value=${i}>${x[0]}</option>`).join('')}</select></div><div><label>Gula (sendok teh)</label><input id=cg type=number min=0 value=0 onchange="cof()"></div><div><label>Sirup (pump)</label><input id=cs type=number min=0 value=0 onchange="cof()"></div></div><div id=cr class=card style="margin-top:10px"></div><button class=b onclick="addC()">Tambah ke log makanan</button></div>
<div class=card><h2>Kafein hari ${day}: ${N(f.caf)} mg</h2>${pb(f.caf,400)}<p class=mu>Batas umum untuk dewasa sehat: sekitar 400 mg/hari (EFSA, FDA).</p></div>
<div class=card><h2>Panduan</h2><p>Espresso dan Americano hampir tanpa kalori (±2–10 kkal). Kalori latte berasal dari susu, gula, dan sirup: latte sedang dengan susu full cream bisa 130–160 kkal, tanpa gula maupun dengan gula tambahan. Susu skim atau almond tanpa gula lebih rendah kalori.</p><p>Kafein 3–6 mg/kg berat badan sekitar 60 menit sebelum latihan dapat meningkatkan performa (ISSN), tetapi dosis tinggi dapat menimbulkan gelisah. Hindari kafein 6–8 jam sebelum tidur karena tidur memengaruhi pemulihan. Olahraga tidak otomatis menghapus kalori minuman, jadi catat semuanya.</p></div>`}
function cof(){const t=+$('#ct').value,z=+$('#cz').value,m=MK[+$('#cm').value],g=+$('#cg').value||0,sy=+$('#cs').value||0,sh=z+1;
 const ml=t==2?[150,220,300][z]:0,mk=ml/100,k=2*sh+(t==1?3:0)+m[1]*mk+g*16+sy*20,p=m[2]*mk+.3*sh,c=m[3]*mk+g*4+sy*5,f=m[4]*mk,caf=63*sh;
 lastC={n:['Espresso','Americano','Latte'][t]+' '+['kecil','sedang','besar'][z]+(t==2?', susu '+m[0].toLowerCase():'')+(g?', gula '+g+' sdt':'')+(sy?', sirup '+sy+' pump':''),k,p,c,f,caf,e:'estimasi'};
 $('#cr').innerHTML=`<b>${N(k)} kkal</b> · P${N(p,1)} K${N(c,1)} L${N(f,1)} · Kafein ±${caf} mg <span class=mu>(estimasi)</span>`}
function addC(){if(lastC)push(Object.assign({},lastC))}
function vPr(){const L=S.log[day]||{},F=(k,l)=>`<div><label>${l}</label><input type=number step=.1 min=0 value="${L[k]||''}" onchange="lg('${k}',this.value)"></div>`;
 const v=[];for(let d=1;d<=30;d++){const q=sess(d);if(q>=0&&vol(d,q)>0)v.push([d,vol(d,q)])}
 return`<div class=card><h2>Catat hari ${day}</h2><div class=g>${F('w','Berat badan (kg)')}${F('waist','Lingkar perut (cm)')}${F('chest','Lingkar dada (cm)')}${F('arm','Lingkar lengan (cm)')}${F('thigh','Lingkar paha (cm)')}${F('steps','Langkah')}${F('sleep','Tidur (jam)')}</div><p class=mu>Ukur pagi hari, sebelum makan, dengan kondisi sama. Perut: setinggi pusar saat napas keluar. Dada: setinggi puting. Lengan: bagian terbesar (relaks). Paha: bagian terbesar. Foto progres dapat disimpan di galeri ponsel Anda.</p></div>
<div class=card><h2>Berat badan (kg)</h2>${chart(ser('w'),'#60a5fa',' kg')}</div><div class=card><h2>Lingkar perut (cm)</h2>${chart(ser('waist'),'#34d399',' cm')}</div><div class=card><h2>Volume latihan per sesi (kg)</h2>${chart(v,'#fbbf24',' kg')}</div>
<div class=card><h2>Evaluasi</h2><p>${phase(day)}.</p><p class=mu>Kenaikan berat badan tidak otomatis berarti otot bertambah. Nilai tren lingkar perut, kekuatan latihan, dan berat dalam 1–2 minggu. Jika kelelahan menumpuk atau performa turun, kurangi volume sekitar 30–50% selama satu minggu (deload).</p></div>`}
function lg(k,v){S.log[day]=S.log[day]||{};S.log[day][k]=+v;save();render()}
function vEd(){const D=(t,b)=>`<details><summary>${t}</summary><p>${b}</p></details>`;return`<div class=card><h2>Edukasi</h2>
${D('1. Apa itu body recomposition?','Menurunkan lemak sambil mempertahankan atau menambah otot pada waktu yang sama. Paling realistis pada pemula, orang yang kembali berlatih, atau yang kelebihan lemak, dengan latihan beban dan protein cukup.')}
${D('2. Fat loss vs weight loss','Weight loss adalah turunnya berat total (lemak, otot, air, glikogen). Fat loss khusus lemak. Karena itu pantau juga lingkar perut dan kekuatan, bukan hanya timbangan.')}
${D('3. Cara kerja defisit kalori','Lemak tubuh berkurang saat energi masuk lebih kecil daripada energi yang dipakai. Defisit ringan (±15–20%) lebih mudah dipertahankan dan lebih aman untuk otot. Lemak perut tidak bisa dipilih untuk dibakar; lemak turun dari seluruh tubuh.')}
${D('4. Protein dan sintesis protein otot','Asam amino dari protein menjadi bahan perbaikan dan pertumbuhan otot. ISSN menyebut kisaran 1,4–2,0 g/kg/hari untuk orang aktif; pada defisit kalori, nilai yang lebih tinggi dapat membantu menjaga otot. Bagi ke 3–5 waktu makan.')}
${D('5. Karbohidrat','Sumber energi utama untuk latihan intensitas sedang-tinggi dan pengisi glikogen otot. Pilih sumber utuh (nasi, oat, umbi, buah) dan atur porsinya sesuai sisa kalori.')}
${D('6. Lemak dan hormon','Lemak diperlukan untuk penyerapan vitamin A, D, E, K dan pembentukan hormon (termasuk steroid). Jangan terlalu rendah; sekitar 0,6–1 g/kg umumnya memadai.')}
${D('7. Tidur dan pemulihan','Otot pulih dan beradaptasi saat istirahat. Orang dewasa umumnya membutuhkan 7–9 jam tidur. Kurang tidur dapat menurunkan performa dan memperburuk nafsu makan.')}
${D('8. Makan sebelum dan sesudah latihan','Makan karbohidrat plus protein 1–3 jam sebelum latihan. Setelah latihan, makan yang mengandung protein (±0,3 g/kg) dalam beberapa jam. Total harian lebih penting daripada waktu yang presisi.')}
${D('9. Cara menghitung kalori','Timbang makanan, gunakan label nutrisi bila ada, lalu catat. Nilai dalam aplikasi ini adalah estimasi; masakan rumahan dan minyak sering membuat angka meleset, jadi evaluasi tren mingguan.')}
${D('10. Mempertahankan otot saat defisit','Latihan beban dengan progressive overload, protein cukup, defisit ringan, tidur cukup, dan kardio tidak berlebihan.')}
<h3>Referensi</h3><p class=mu>Mifflin MD dkk. (1990) Am J Clin Nutr 51:241–247 · Jäger R dkk. (2017) ISSN Position Stand: Protein and Exercise, JISSN 14:20 · Kerksick CM dkk. (2018) ISSN Position Stand: Nutrient Timing, JISSN 15:33 · Guest NS dkk. (2021) ISSN Position Stand: Caffeine and Exercise Performance, JISSN 18:1 · ACSM Guidelines for Exercise Testing and Prescription · WHO Guidelines on Physical Activity and Sedentary Behaviour (2020) · EFSA Scientific Opinion on caffeine safety (2015)</p></div>`}
function vSt(){const p=S.p,I=(k,l,t='number')=>`<div><label>${l}</label><input type=${t} step=.1 value="${p[k]}" onchange="sp('${k}',this.value)"></div>`;
 return`<div class=card><h2>Profil (dapat diedit)</h2><div class=g><div><label>Jenis kelamin</label><select onchange="sp('sex',this.value,1)"><option value=M ${p.sex=='M'?'selected':''}>Laki-laki</option><option value=F ${p.sex=='F'?'selected':''}>Perempuan</option></select></div>${I('age','Usia (asumsi, edit)')}${I('h','Tinggi (cm)')}${I('w','Berat awal (kg)')}<div><label>Aktivitas</label><select onchange="sp('act',this.value)">${[[1.2,'Minim'],[1.375,'Ringan'],[1.55,'Cukup aktif'],[1.725,'Sangat aktif']].map(a=>`<option value=${a[0]} ${a[0]==p.act?'selected':''}>${a[1]} (×${a[0]})</option>`).join('')}</select></div>${I('def','Defisit kalori (%)')}${I('start','Tanggal mulai (Hari 1)','date')}</div></div>
<div class=card><h2>Cadangan data</h2><p class=mu>Data tersimpan di browser perangkat ini. Salin teks cadangan untuk memindahkannya ke perangkat lain.</p><textarea id=bk rows=3></textarea><button class=b onclick="$('#bk').value=JSON.stringify(S)">Ekspor</button><button class="b s" onclick="imp()">Impor</button></div><div class=card><button class=b onclick="S.theme=S.theme=='dark'?'light':'dark';save();go('st')">Ganti tema</button><button class="b d" onclick="reset()">${armed?'Ketuk lagi untuk menghapus SEMUA data':'Reset semua data'}</button></div>`}
function sp(k,v,s){S.p[k]=(s||k=='start')?v:+v;save();load2();render()}
function load2(){const d=Math.floor((Date.now()-new Date(S.p.start+'T00:00:00'))/864e5)+1;if(day<1||day>30)day=Math.min(30,Math.max(1,d))}
function imp(){try{S=JSON.parse($('#bk').value);save();render()}catch(e){$('#bk').placeholder='Teks tidak valid'}}
function reset(){if(!armed){armed=true;render();return}armed=false;try{localStorage.removeItem(KEY)}catch(e){}load();render()}
let tI,ts=0;function rt(s){ts=s;clearInterval(tI);tick();tI=setInterval(tick,1000)}
function tick(){$('#tt').textContent=String(Math.floor(ts/60)).padStart(2,'0')+':'+String(ts%60).padStart(2,'0');if(ts<=0){clearInterval(tI);try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}return}ts--}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){document.documentElement.dataset.theme=S.theme;$('#hd').textContent='Hari '+day+' / 30';$('#nv').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('#app').innerHTML={dash:vDash,wo:vWo,nu:vNu,co:vCo,pr:vPr,ed:vEd,st:vSt}[tab]();if(tab=='co')cof()}
load();render();
</script></body></html>
